<div class="bars card subcard">
  <h3>Probabilités</h3>

  <!-- P(bad) -->
  <div class="bar-block">
    <div class="bar-head">
      <span><strong>P(bad)</strong></span>
      <span>{{ "%.1f"|format(result.probability_bad * 100) }}%</span>
    </div>

    <div class="bar-track">
      <div
        class="bar-fill bad risk-{{ result.risk_level }}"
        style="width: {{ (result.probability_bad * 100) | round(1) }}%;"
      ></div>

      <!-- Seuil ACCEPT -->
      <div class="threshold-line accept"
          style="left: {{ (result.threshold_accept * 100) | round(1) }}%;">
        <span class="threshold-label accept">
          Accept {{ "%.0f"|format(result.threshold_accept * 100) }}%
        </span>
      </div>
      <!-- Seuil REJECT -->
      <div class="threshold-line reject"
          style="left: {{ (result.threshold_reject * 100) | round(1) }}%;">
        <span class="threshold-label reject">
          Reject {{ "%.0f"|format(result.threshold_reject * 100) }}%
        </span>
      </div>
    </div>
  </div>

  <!-- P(good) -->
  <div class="bar-block">
    <div class="bar-head">
      <span><strong>P(good)</strong></span>
      <span>{{ "%.1f"|format(result.probability_good * 100) }}%</span>
    </div>

    <div class="bar-track">
      <div
        class="bar-fill good"
        style="width: {{ (result.probability_good * 100) | round(1) }}%;"
      ></div>
    </div>
  </div>
</div>
